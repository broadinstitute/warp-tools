name: GLIMPSE CI

on:
  # Triggers the workflow on push or pull request events but only for the "develop" and "master" branch
  pull_request:
    branches: [ "develop", "master" ]
    paths:
      - '3rd-party-tools/glimpse/**'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Image Tag (e.g., short commit hash, branch name, or custom tag)'
        required: true
      glimpse_repo:
        description: 'GLIMPSE repository URL'
        default: 'https://github.com/odelaneau/GLIMPSE.git'
        required: true
      glimpse_branch:
        description: 'GLIMPSE branch name'
        default: 'master'
        required: false

permissions:
  contents: read

env:
  PROJECT_NAME: WARP 3rd Party Tools
  # GitHub repo name
  REPOSITORY_NAME: ${{ github.event.repository.name }}
  # Region-specific Google Docker repository where GOOGLE_PROJECT/REPOSITORY_NAME can be found
  DOCKER_REGISTRY: us.gcr.io
  GCR_PATH: broad-gotc-prod/imputation-glimpse
  TAG: ${{ github.event.inputs.image_tag || github.head_ref || github.ref_name }}
  # GLIMPSE repository url - always build from official GLIMPSE repo
  GLIMPSE_REPO: 'https://github.com/odelaneau/GLIMPSE.git'
  GLIMPSE_BRANCH: ${{ github.event.inputs.glimpse_branch || 'master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      imagePath: ${{ steps.saveImagePath.outputs.url }}
    steps:
    # Checks out repository under $GITHUB_WORKSPACE, so the job can access it
    - uses: actions/checkout@v3

    # Checkout the palantir-workflows repository
    - name: Checkout palantir-workflows repository
      uses: actions/checkout@v3
      with:
        repository: broadinstitute/palantir-workflows
        path: palantir-workflows

    # Log into the Google Docker registry early so the build script can push
    - id: 'Auth'
      name: Login to GCR
      uses: docker/login-action@v2
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: _json_key
        password: ${{ secrets.GCR_CI_KEY }}

    # Build and push the Docker image using palantir-workflows build script
    - name: Build GLIMPSE Docker image using script in palantir-workflows
      working-directory: palantir-workflows/GlimpseImputationPipeline/glimpse_docker
      run: |
        # Make the script executable
        chmod +x build_base_and_extension_docker.sh
        
        # Build the full tag with registry path
        FULL_TAG="${DOCKER_REGISTRY}/${GCR_PATH}:${TAG}"
        
        # Run the build script with push flag
        echo "Building and pushing image with tag: $FULL_TAG"
        bash build_base_and_extension_docker.sh \
          -r "$GLIMPSE_REPO" \
          -b "$GLIMPSE_BRANCH" \
          -t "$FULL_TAG" \
          -p \
          -y

    # Save the image path to an output
    - id: 'saveImagePath'
      run: echo "url=${DOCKER_REGISTRY}/${GCR_PATH}:${TAG}" >> $GITHUB_OUTPUT

    # Display the final image tag
    - name: Display image information
      run: |
        echo "GLIMPSE Docker image built and pushed successfully!"
        echo "Image: ${DOCKER_REGISTRY}/${GCR_PATH}:${TAG}"
        echo "GLIMPSE Repo: ${GLIMPSE_REPO}"
        echo "GLIMPSE Branch: ${GLIMPSE_BRANCH}"
