# This GHA workflow builds and pushes an SV Imputation Rust Tools Docker image to Google Container Registry (GCR)
# whenever there is a pull request to the develop or master branches that modifies files in the
# 3rd-party-tools/sv-imputation-rust-tools directory. It can also be triggered manually with custom inputs for
# the image tag and commit hash. The workflow uses the local docker_build.sh script to create the Docker image,
# which includes cloning the lrma-sv-imputation-utils repository, building the Rust tools, and pushing it to GCR.
name: SV Imputation Rust Tools CI

on:
  # Triggers the workflow on push or pull request events but only for the "develop" and "master" branch
  pull_request:
    branches: [ "develop", "master" ]
    paths:
      - '3rd-party-tools/sv-imputation-rust-tools/**'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag name (optional, e.g., "v1.0.0" or "my-test-build"; will auto-generate if not provided)'
        required: false
      git_commit:
        description: 'lrma-sv-imputation-utils commit hash (optional, will fetch latest from main if not provided)'
        required: false # it needs to be optional to run GHA against a PR branch

permissions:
  contents: read

env:
  PROJECT_NAME: WARP 3rd Party Tools
  # GitHub repo name
  REPOSITORY_NAME: ${{ github.event.repository.name }}
  # Region-specific Google Docker repository where GOOGLE_PROJECT/REPOSITORY_NAME can be found
  DOCKER_REGISTRY: us.gcr.io
  GCR_PATH: broad-gotc-prod/sv-imputation-rust-tools
  # Optional tag - uses manual input, or PR branch name, or falls back to ref name
  TAG: ${{ github.event.inputs.image_tag || github.head_ref || github.ref_name }}
  # Git commit will be set in the build step if not provided
  GIT_COMMIT_INPUT: ${{ github.event.inputs.git_commit }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      imagePath: ${{ steps.saveImagePath.outputs.url }}
    steps:
    # Checks out repository under $GITHUB_WORKSPACE, so the job can access it
    - uses: actions/checkout@v3

    # Log into the Google Docker registry so the build script can push
    - id: 'Auth'
      name: Login to GCR
      uses: docker/login-action@v2
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: _json_key
        password: ${{ secrets.GCR_CI_KEY }}

    # Build and push the Docker image using local docker_build.sh script
    - name: Build and push SV Imputation Rust Tools Docker image using local script
      working-directory: 3rd-party-tools/sv-imputation-rust-tools
      run: |
        # Make the script executable
        chmod +x docker_build.sh
        
        # Build arguments - always use -y for non-interactive
        BUILD_ARGS="-y"
        
        # Determine Git commit to use
        if [ -n "$GIT_COMMIT_INPUT" ]; then
          GIT_COMMIT="$GIT_COMMIT_INPUT"
          echo "Using provided lrma-sv-imputation-utils commit: $GIT_COMMIT"
          # Add commit argument
          BUILD_ARGS="$BUILD_ARGS -c $GIT_COMMIT"
        else
          # Don't pass -c flag, let the script auto-fetch
          echo "No commit provided, docker_build.sh will fetch latest from main branch..."
        fi
        
        # Add optional tag if specified
        if [ -n "$TAG" ]; then
          FULL_TAG="${DOCKER_REGISTRY}/${GCR_PATH}:${TAG}"
          BUILD_ARGS="$BUILD_ARGS -t $FULL_TAG"
          echo "Building with custom tag: $FULL_TAG"
        else
          echo "Building with auto-generated tag"
        fi
        
        # Run the build script
        echo "Running: ./docker_build.sh $BUILD_ARGS"
        ./docker_build.sh $BUILD_ARGS
