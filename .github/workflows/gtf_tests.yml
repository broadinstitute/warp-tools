name: GTF Comparison Tests

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "develop" and "master" branch
  pull_request:
    branches: [ "develop", "master" ]
    paths:
      - '3rd-party-tools/build-indices/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # Check out the code
    - uses: actions/checkout@v3

    # Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.x'

    # Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas

    # Change to the directory containing the scripts
    - name: Change working directory
      run: cd 3rd-party-tools/build-indices
      shell: bash

    # Create test data directory (relative to the script location)
    - name: Create test data directory
      run: mkdir -p 3rd-party-tools/build-indices/test_data 3rd-party-tools/build-indices/test_output

    # Create test data
    - name: Create test data
      run: python 3rd-party-tools/build-indices/create_test_gtfs.py

    # Run tests
    - name: Run tests
      run: python -m unittest 3rd-party-tools/build-indices/test_gtf_comparison.py -v

    # Upload test results
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: 3rd-party-tools/build-indices/test_output/
