name: base
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
 - python=3.9
 - pip
 - jupyter
 - snakemake
 - pytables
 - seaborn
 - yaml
 - cutadapt
 - samtools
 # Pinned: the unpinned env resolved picard 3.5.0 on rebuild (2.4 shipped 3.1.1),
 # and 3.5.0 raises a NullPointerException on the hisat-3n BAMs because they carry
 # no @RG read group. 3.1.1 tolerates that.
 - picard=3.1.1
 - bedtools
 - htslib=1.15
 - pysam
 - pybedtools
 - pyBigWig
 - pip:
    - papermill
    - allcools
    # Pinned to a commit, not a tag: snm3c_summary's mc_format='cz' support
    # (needed to build MappingSummary from cz counts instead of allc) landed in
    # 29dca7e5 and is in no released tag, including 1.8.1 and 1.8.2.
    # 1fcfc1fb also adds the lambda metrics that pair with cytozip --lambda_chrom.
    - git+https://github.com/DingWB/cemba_data@1fcfc1fb5